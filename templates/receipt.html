<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Receipt - SmartBiz</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🧾 Create Receipt</h1>

    <form method="POST">

        <input
            type="text"
            name="customer"
            placeholder="Customer Name"
            required
        >

        <label>Product</label>

        <select name="item" id="product" required onchange="updatePrice()">

            <option value="">Select Product</option>

            {% for product in products %}

            <option
                value="{{ product['name'] }}"
                data-price="{{ product['selling_price'] }}"
                data-stock="{{ product['stock'] }}"
            >
                {{ product['name'] }}
                — Stock: {{ product['stock'] }}
            </option>

            {% endfor %}

        </select>

<label for="customer">Customer</label>

<select name="customer" id="customer" required>
    <option value="">-- Select Customer --</option>

    {% for customer in customers %}
        <option value="{{ customer['name'] }}">
            {{ customer['name'] }}
        </option>
    {% endfor %}
</select>

        <input
            type="number"
            name="price"
            id="price"
            placeholder="Price per Item (KSh)"
            min="0"
            step="0.01"
            required
            readonly
        >

        <p id="stock-message"></p>

        <select name="payment_method" required>

            <option value="">
                Payment Method
            </option>

            <option value="Cash">
                Cash
            </option>

            <option value="M-Pesa">
                M-Pesa
            </option>

            <option value="Bank">
                Bank
            </option>

            <option value="Cheque">
                Cheque
            </option>

        </select>

        <button type="submit">
            Generate Receipt
        </button>

    </form>

    <p>
        <a href="{{ url_for('dashboard') }}">
            ← Back to Dashboard
        </a>
    </p>

</div>


<script>

function updatePrice() {

    const product =
        document.getElementById("product");

    const selected =
        product.options[product.selectedIndex];

    const price =
        selected.getAttribute("data-price");

    const stock =
        selected.getAttribute("data-stock");

    document.getElementById("price").value =
        price || "";

    const message =
        document.getElementById("stock-message");

    if (stock !== null) {

        message.innerHTML =
            "📦 Available stock: <strong>"
            + stock +
            "</strong>";

    } else {

        message.innerHTML = "";

    }
}

</script>

</body>
</html>
