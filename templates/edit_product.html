<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product - SmartBiz</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>✏️ Edit Product</h1>

    <form method="POST">

        <label>Product Name</label>
        <input
            type="text"
            name="name"
            value="{{ product['name'] }}"
            required
        >

        <label>SKU</label>
        <input
            type="text"
            name="sku"
            value="{{ product['sku'] }}"
        >

        <label>Buying Price (KSh)</label>
        <input
            type="number"
            name="buying_price"
            min="0"
            step="0.01"
            value="{{ product['buying_price'] }}"
            required
        >

        <label>Selling Price (KSh)</label>
        <input
            type="number"
            name="selling_price"
            min="0"
            step="0.01"
            value="{{ product['selling_price'] }}"
            required
        >

        <label>Stock Quantity</label>
        <input
            type="number"
            name="stock"
            min="0"
            step="1"
            value="{{ product['stock'] }}"
            required
        >

        <label>Low-Stock Alert Level</label>
        <input
            type="number"
            name="low_stock_level"
            min="0"
            step="1"
            value="{{ product['low_stock_level'] }}"
            required
        >

        <button type="submit">
            💾 Save Changes
        </button>

    </form>

    <p>
        <a href="{{ url_for('inventory') }}">
            ← Back to Inventory
        </a>
    </p>

</div>

</body>
  </html>
