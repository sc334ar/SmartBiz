<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Invoice - SmartBiz</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>📄 Create Invoice</h1>

    <p>Create an invoice for your customer</p>

    <form method="POST">

        <!-- CUSTOMER -->

        <label for="customer">
            Customer Name
        </label>

        <input
            type="text"
            id="customer"
            name="customer"
            placeholder="Customer Name"
            required
        >


        <!-- DUE DATE -->

        <label for="due_date">
            Due Date
        </label>

        <input
            type="date"
            id="due_date"
            name="due_date"
            required
        >


        <h3>🛒 Invoice Items</h3>

        <div id="items">

            <div class="invoice-item">

                <input
                    type="text"
                    name="item[]"
                    placeholder="Item or Service"
                    required
                    oninput="calculateTotal()"
                >

                <input
                    type="number"
                    name="quantity[]"
                    placeholder="Quantity"
                    min="1"
                    value="1"
                    required
                    oninput="calculateTotal()"
                >

                <input
                    type="number"
                    name="price[]"
                    placeholder="Price (KSh)"
                    min="0.01"
                    step="0.01"
                    required
                    oninput="calculateTotal()"
                >

                <button
                    type="button"
                    onclick="removeItem(this)">

                    🗑️ Remove

                </button>

            </div>

        </div>


        <!-- ADD ITEM -->

        <button
            type="button"
            onclick="addItem()">

            ➕ Add Another Item

        </button>


        <!-- TOTAL -->

        <div class="invoice-total">

            <h2>
                Total:
                KSh <span id="total">0.00</span>
            </h2>

        </div>


        <!-- SUBMIT -->

        <button type="submit">

            📄 Generate Invoice

        </button>

    </form>


    <p>

        <a href="{{ url_for('dashboard') }}">
            ← Back to Dashboard
        </a>

    </p>

</div>


<script>

/* =========================
   ADD ITEM
========================= */

function addItem() {

    const items =
        document.getElementById("items");

    const newItem =
        document.createElement("div");

    newItem.className =
        "invoice-item";

    newItem.innerHTML = `

        <input
            type="text"
            name="item[]"
            placeholder="Item or Service"
            required
            oninput="calculateTotal()"
        >

        <input
            type="number"
            name="quantity[]"
            placeholder="Quantity"
            min="1"
            value="1"
            required
            oninput="calculateTotal()"
        >

        <input
            type="number"
            name="price[]"
            placeholder="Price (KSh)"
            min="0.01"
            step="0.01"
            required
            oninput="calculateTotal()"
        >

        <button
            type="button"
            onclick="removeItem(this)">

            🗑️ Remove

        </button>

    `;

    items.appendChild(newItem);

    calculateTotal();
}


/* =========================
   REMOVE ITEM
========================= */

function removeItem(button) {

    const items =
        document.querySelectorAll(
            ".invoice-item"
        );

    if (items.length <= 1) {

        alert(
            "An invoice must have at least one item."
        );

        return;
    }

    button.parentElement.remove();

    calculateTotal();
}


/* =========================
   CALCULATE TOTAL
========================= */

function calculateTotal() {

    const quantities =
        document.querySelectorAll(
            'input[name="quantity[]"]'
        );

    const prices =
        document.querySelectorAll(
            'input[name="price[]"]'
        );

    let total = 0;

    for (let i = 0; i < quantities.length; i++) {

        const quantity =
            parseFloat(quantities[i].value) || 0;

        const price =
            parseFloat(prices[i].value) || 0;

        total += quantity * price;
    }

    document.getElementById("total").textContent =
        total.toFixed(2);
}

</script>

</body>

            </html>
