<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Invoice - SmartBiz</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>📄 Create Invoice</h1>

    <p>Create an invoice for your customer</p>

    <form method="POST">

        <input
            type="text"
            name="customer"
            placeholder="Customer Name"
            required
        >

        <label>Due Date</label>

        <input
            type="date"
            name="due_date"
            required
        >

        <h3>Invoice Items</h3>

        <div id="items">

            <div class="invoice-item">

                <input
                    type="text"
                    name="item[]"
                    placeholder="Item or Service"
                    required
                >

                <input
                    type="number"
                    name="quantity[]"
                    placeholder="Quantity"
                    min="1"
                    required
                >

                <input
                    type="number"
                    name="price[]"
                    placeholder="Price (KSh)"
                    min="0.01"
                    step="0.01"
                    required
                >

            </div>

        </div>

        <button
            type="button"
            onclick="addItem()">

            ➕ Add Another Item

        </button>

        <button type="submit">

            Generate Invoice

        </button>

    </form>

    <p>

        <a href="{{ url_for('dashboard') }}">
            ← Back to Dashboard
        </a>

    </p>

</div>


<script>

function addItem() {

    const items = document.getElementById("items");

    const newItem = document.createElement("div");

    newItem.className = "invoice-item";

    newItem.innerHTML = `

        <input
            type="text"
            name="item[]"
            placeholder="Item or Service"
            required
        >

        <input
            type="number"
            name="quantity[]"
            placeholder="Quantity"
            min="1"
            required
        >

        <input
            type="number"
            name="price[]"
            placeholder="Price (KSh)"
            min="0.01"
            step="0.01"
            required
        >

    `;

    items.appendChild(newItem);
}

</script>

</body>

                  </html>
